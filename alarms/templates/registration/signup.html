{% extends "base.html" %}

{% block content %}
    <div class="sheet standalone">
        <h3>Sign up</h3>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="sheet-actions">
                <button type="submit" class="btn primary" style="flex:1;">Sign up</button>
            </div>
        </form>
    </div>
{% endblock %}
